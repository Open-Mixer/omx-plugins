name: release

# A version tag builds omx-plugins-clap and omx-plugins-lv2 as RPMs (Fedora 44, x86_64 and aarch64) and
# DEBs (bookworm and trixie, amd64 and arm64), signs them, publishes them into the rpm/ and deb/ trees of
# the FreeMixer Pages repository and attaches them to the GitHub release, with the trixie arm64 DEBs
# repacked as a Zynthian tarball beside them. Anything else builds unsigned trees and publishes nothing. Everything is in Open-Mixer/.github; the secrets are the organisation's.
# The build dependencies the distributions do not carry (omx-dsp-devel, omx-clap-core-devel,
# omx-clap-host) come from the FreeMixer channel, inside the build containers only.
# Nothing is built for release before every plugin has a suitable real-time-safety verdict (the qualify job).

# A manual run with staged on (never a tag) builds fc44 x86_64 and trixie amd64 only, against the staging channel, and
# publishes them, signed, to the staging channel (staging/rpm and staging/deb of the channel repository), where the
# next layer of the release chain finds them by adding the staging channel beside the real one. Nothing reaches the
# real channel, and the real release still publishes once from the v<version> tag (Open-Mixer/.github build-rpm.yml
# and build-deb.yml).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sign and publish; only a run on a tag publishes'
        type: boolean
        default: false
      staged:
        description: 'Build fc44 x86_64 and trixie amd64 only and publish them to the staging channel for the next layer; publishes nothing to the real channel'
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      runner:
        type: string
        default: 'ubuntu-latest'
        description: "Runner for the x86 jobs"
      arm:
        type: boolean
        default: true
        description: "Build the arm64/aarch64 packages too; the pull-request dry run passes false (arm builds run at release only)"
      staged:
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  # The decision of 2026-10-10: plugin-qualify's real-time-safety verdict runs over every plugin, THEN omx-plugins
  # is released. The rpm job below publishes the moment it builds, so this job comes first and the release waits
  # on it: tools/qualify-release.sh builds the tree, qualifies every installed .clap and refuses unless each one's
  # qualification record says suitable. The records and the probe outputs they judged are attached to the run.
  qualify:
    name: RT-safety verdict (every plugin)
    runs-on: ${{ (inputs.runner != 'ubuntu-latest' && inputs.runner) || github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.OMX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: fedora:44
    steps:
      - name: Install git and dnf plugins
        run: dnf install -y --setopt=install_weak_deps=False git dnf5-plugins nodejs

      - name: Add the OpenMixer repository
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          staging: ${{ inputs.staged == true }}

      - uses: actions/checkout@v4

      # a dedupe/all run builds on its siblings' dedupe/all (.github/wave-deps); @main until Open-Mixer/.github moves v1 past it
      - uses: Open-Mixer/.github/.github/actions/wave-deps@openmixer-v1

      - name: Install the build dependencies and the prober
        run: |
          dnf builddep -y --setopt=install_weak_deps=False packaging/omx-plugins.spec
          tools/ci-stale-units.sh
          dnf install -y --setopt=install_weak_deps=False 'plugin-qualify >= 0.11.0' omx-clap-host

      - name: Qualify every plugin; refuse the release unless each is suitable
        run: tools/qualify-release.sh qualification

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: omx-plugins-qualification
          path: |
            qualification/*.qualification.json
            qualification/*.probe.json
          if-no-files-found: warn
          retention-days: 90

  rpm:
    needs: qualify
    uses: Open-Mixer/.github/.github/workflows/build-rpm.yml@openmixer-v1
    with:
      staged: ${{ inputs.staged == true }}
      package-name: omx-plugins
      binary-names: omx-plugins omx-plugins-clap omx-plugins-lv2
      publish: ${{ github.event_name == 'push' || inputs.publish == true }}
      needs-mod-host: false
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
      arch-matrix: ${{ (github.event_name != 'push' && inputs.arm == false) && '["x86_64"]' || '["x86_64", "aarch64"]' }}
      channel-deps: true
    secrets: inherit

  # beside the RPMs: the two publish jobs share one concurrency group, so their pushes never race
  deb:
    needs: qualify
    uses: Open-Mixer/.github/.github/workflows/build-deb.yml@openmixer-v1
    with:
      staged: ${{ inputs.staged == true }}
      package-name: omx-plugins
      binary-names: omx-plugins omx-plugins-clap omx-plugins-lv2
      publish: ${{ github.event_name == 'push' || inputs.publish == true }}
      dependencies: 'clap-headers'
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
      arch-matrix: ${{ (github.event_name != 'push' && inputs.arm == false) && '["amd64"]' || '["amd64", "arm64"]' }}
      requires: ''
      channel-deps: true
    secrets: inherit

  # The trixie DEBs just built, repacked as one tarball laid out for a Zynthian's plugin directories
  # (tools/zynthian-bundle.sh): no rebuild, the same files the packages carry, checked and every LV2
  # plugin instantiated on the target architecture. arm64 at release; the pull-request dry run packs the
  # amd64 build the same way.
  zynthian:
    name: Zynthian tarball (trixie, ${{ (github.event_name != 'push' && inputs.arm == false) && 'amd64' || 'arm64' }})
    needs: deb
    # not on a staged run: it reads packages a staged run does not build
    if: ${{ !cancelled() && needs.deb.result == 'success' && inputs.staged != true }}
    runs-on: ${{ (github.event_name != 'push' && inputs.arm == false) && ((inputs.runner != 'ubuntu-latest' && inputs.runner) || github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.OMX_RUNNER || 'ubuntu-latest') || 'ubuntu-24.04-arm' }}
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: debian:trixie
    env:
      ARCH: ${{ (github.event_name != 'push' && inputs.arm == false) && 'amd64' || 'arm64' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the packing and probing tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends make file binutils lilv-utils

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: omx-plugins-debs-trixie-${{ env.ARCH }}
          path: debs

      - name: Pack, check and probe
        run: tools/zynthian-bundle.sh debs "$ARCH" zynthian

      - uses: actions/upload-artifact@v4
        with:
          name: omx-plugins-zynthian-${{ env.ARCH }}
          path: zynthian/*
          if-no-files-found: error
          retention-days: 30

  # attached beside the DEBs; the deb job's own release step has created the release by now
  zynthian-release:
    name: Attach the Zynthian tarball to the release
    needs: zynthian
    if: ${{ !cancelled() && needs.zynthian.result == 'success' && github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish == true) }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: omx-plugins-zynthian-arm64
          path: zynthian

      - name: Attach, never creating a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null || { echo "::error::no release for $TAG"; exit 1; }
          gh release upload "$TAG" zynthian/* --clobber --repo "$GITHUB_REPOSITORY"
