name: ci

# On workflow_dispatch only (a pull request and a push run the lint workflow; the cluster verify row runs the suite): the whole suite on Fedora, with no test skipped. On workflow_dispatch also: the RPMs and DEBs
# built (their own make test included), their file lists checked and the packages installed and loaded
# by a CLAP and an LV2 scanner; and the release workflow as a dry run. Nothing is signed or published
# here. The build dependencies come from the packaging (dnf builddep, apt-get build-dep), the ones
# Fedora and Debian do not carry from the OpenMixer channel; nothing is pinned or fetched by version. A pull
# request into dedupe/all, and a push to it, take the siblings listed in .github/wave-deps from their own dedupe/all.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run it supersedes. Every other run (main, a tag) has a group of its own
  # and is never cancelled; the run id keeps two pushes to main from replacing each other while one is queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The packages (and the jobs that need this one) run only on workflow_dispatch: a pull request or a push runs the tests
  # alone (owner 2026-11-09). release.yml builds on a v* tag; fast-release dispatches this workflow on a release head.
  changes:
    name: what the pull request changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.diff.outputs.packages }}
      machinery: ${{ steps.diff.outputs.machinery }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Packaging runs only on workflow_dispatch (the release dry run fast-release dispatches on a release head);
      # a pull request or a push runs the tests alone. release.yml builds and publishes on a v* tag.
      # The checkout of a pull request is its merge commit and the first parent is the base, so the diff is what the
      # pull request adds. Any other event, or a diff that cannot be read, runs the recipe selftest.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then echo "packages=true"; else echo "packages=false"; fi >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != pull_request ] || ! changed=$(git diff --name-only HEAD^1 HEAD) || [ -z "$changed" ]; then
            echo "machinery=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$changed"
          # the recipe selftest (15 to 25 minutes in CI) runs when the change can move it: tools/ci-scope.sh
          tools/ci-scope.sh <<<"$changed" >> "$GITHUB_OUTPUT"

  # the Fedora cells every rpm-side job runs in, from Open-Mixer/.github's check-matrix (ruling D25: no Fedora release
  # written into a job; omx-plugins#54): one container per cell, the job and its artifacts named by it
  rpm-cells:
    name: the rpm cells (check-matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rpm: ${{ steps.m.outputs.rpm }}
      rpm-count: ${{ steps.m.outputs.rpm-count }}
    steps:
      - id: m
        uses: Open-Mixer/.github/.github/actions/check-matrix@openmixer-v1
        with:
          wave: ${{ vars.OMX_RELEASE_MATRIX }}
          rpm-releases: '["45"]'
          rpm-arches: '["x86_64"]'  # no aarch64 RPMs: off by the owner ruling of 2026-11-19 until the full matrix returns
          x86-runner: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.OMX_RUNNER || 'ubuntu-latest' }}

  # the lints run in a job of their own: a lint red never skips a step of the suite, which runs and reports whatever the
  # lint says (a lint step before make test in the same job skipped the suite on its red, and hid every red behind it)
  lint:
    name: the licence headers and no private reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Every file a comment can be written in opens with its licence
        id: handback-spdx
        uses: Open-Mixer/.github/.github/actions/spdx-check@main

      - name: No tracked file points into a private repository
        id: handback-private-refs
        uses: Open-Mixer/.github/.github/actions/private-refs-check@openmixer-v1

  test:
    name: make test (fedora ${{ matrix.cell.fedora }}, ${{ matrix.cell.arch }})
    needs: rpm-cells
    if: needs.rpm-cells.outputs.rpm-count != '0'
    runs-on: ${{ matrix.cell.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.rpm-cells.outputs.rpm) }}
    container:
      image: ${{ matrix.cell.image }}
    steps:
      - name: Install the build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False git dnf5-plugins

      - name: Add the OpenMixer repository
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          # a pull request into devel, or a dispatch off main, in a wave reads that wave's devel channel above staging (Open-Mixer/.github#329)
          devel-channel: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_CHANNEL || '' }}
          devel-base: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_BASE || '' }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # main and its history: make completeness reads the debt at the merge-base

      - name: The checkout is a git directory this job may read
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # a dedupe/all run builds on its siblings' dedupe/all (.github/wave-deps); @main until Open-Mixer/.github moves v1 past it
      - uses: Open-Mixer/.github/.github/actions/wave-deps@openmixer-v1

      - name: Install what the spec builds and tests with
        run: |
          dnf builddep -y --setopt=install_weak_deps=False packaging/omx-plugins.spec

      # an ordinary run builds against the channel, never staging (D25): tools/from-channel-check.sh
      - name: Every omx package comes from the channel
        env:
          # a wave's run builds against its devel channel and staging (Open-Mixer/.github#329)
          OMX_WAVE: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_CHANNEL || '' }}
          # and the base waves add-openmixer's devel-base added beneath it
          OMX_DEVEL_BASE: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_BASE || '' }}
        run: tools/from-channel-check.sh

      - name: The version agrees everywhere it is written
        id: handback-version
        run: |
          set -euo pipefail
          v=$(make -s version)
          grep -q "^Version: $v\$" packaging/omx-plugins.spec
          head -1 debian/changelog | grep -q "^omx-plugins ($v) "

      - name: The packaging declares each dependency's range once, the same for RPM and DEB
        id: handback-deps
        run: |
          set -euo pipefail
          tools/deps-check.sh
          tools/deps-check.sh --self-test

      - name: No source carries a copy of a function omx-dsp exports, and a planted copy goes red
        id: handback-dsp-copies
        run: make dsp-copies

      - name: No tracked file is a film strip or a fixture omx-panel ships, and a planted one goes red
        id: handback-panel-copies
        run: make panel-copies

      - name: Every generated file is fresh, built or not
        id: handback-gen
        run: |
          set -euo pipefail
          node tools/gen.mjs --check
          node tools/gen-presets.mjs --check
          make check-params-doc

      - name: make test, and nothing skipped
        id: handback-test
        run: |
          set -euo pipefail
          make test 2>&1 | tee test.log
          if grep -E '^SKIP' test.log; then echo "::error::a test was skipped"; exit 1; fi

      - name: Every plugin has every artifact of the plugin recipe
        id: handback-completeness
        run: make completeness

      # one pack per listed language from the spec and debian/control, and the labels' catalogs (catalogs/) through
      # omx-contract's release gate (tools/catalogs-gate.sh, translate --check): a listed language with no catalog, a
      # missing key or a stale entry is red (#18). Check only: the fill job below makes the entries
      - name: The language packs
        id: handback-langpacks
        uses: Open-Mixer/.github/.github/actions/langpacks@openmixer-v1
        with:
          name: omx-plugins
          owner: omx-plugins
          spec: packaging/omx-plugins.spec
          gate: tools/catalogs-gate.sh
          fill: 'false'

      - name: include/omx_meter_ring.h never hands a reader two blocks at once, and each sabotage goes red
        id: handback-meter-ring
        run: |
          set -euo pipefail
          # gcc only when absent: the cluster's worker image carries it and its verify runs unprivileged
          command -v gcc >/dev/null || dnf install -y --setopt=install_weak_deps=False gcc
          make meter-ring

  # the catalogs' gaps fill themselves on the organisation's own pool, where the router answers (owner ruling
  # 2026-11-20): dispatched on a lane branch that heads one open pull request of this repository, the shared workflow
  # makes the missing entries through the router, signs them and pushes them to that branch only. The gate installs the
  # labels domain into a scratch contract directory (make install-labels-domain), so it needs make, pkg-config and
  # omx-contract-devel's install script
  fill:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    uses: Open-Mixer/.github/.github/workflows/langpacks-fill.yml@openmixer-v1
    with:
      name: omx-plugins
      owner: omx-plugins
      spec: packaging/omx-plugins.spec
      gate: tools/catalogs-gate.sh
      # the keys are the labels domain's: the gate script installs it into a scratch contract directory, for a language too
      fill-command: tools/catalogs-gate.sh
      packages: make pkgconf-pkg-config omx-contract-devel
    secrets: inherit

  test-heavy:
    # Beside make test: the set that runs the built plugins through a host (each plugin's oracles on both faces, host-check.sh, the round trip), in four slices of the plugins in parallel, the round trip in the
    # first. The package build runs make test only; every check of both sets runs on every pull request
    # (tools/test/test-split.json). The slice comes from the job's environment, so the step itself is plain
    # `make test-heavy`, which runs every slice when OMX_HEAVY_SHARD is unset.
    name: make test-heavy ${{ matrix.shard }} (fedora ${{ matrix.cell.fedora }}, ${{ matrix.cell.arch }})
    needs: rpm-cells
    if: needs.rpm-cells.outputs.rpm-count != '0'
    runs-on: ${{ matrix.cell.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.rpm-cells.outputs.rpm) }}
        shard:
          - 1/4
          - 2/4
          - 3/4
          - 4/4
    env:
      OMX_HEAVY_SHARD: ${{ matrix.shard }}
    container:
      image: ${{ matrix.cell.image }}
    steps:
      - name: Install the build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False git dnf5-plugins

      - name: Add the OpenMixer repository
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          # a pull request into devel, or a dispatch off main, in a wave reads that wave's devel channel above staging (Open-Mixer/.github#329)
          devel-channel: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_CHANNEL || '' }}
          devel-base: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_BASE || '' }}

      - uses: actions/checkout@v4

      - name: The checkout is a git directory this job may read
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # a dedupe/all run builds on its siblings' dedupe/all (.github/wave-deps); @main until Open-Mixer/.github moves v1 past it
      - uses: Open-Mixer/.github/.github/actions/wave-deps@openmixer-v1

      - name: Install what the spec builds and tests with
        run: |
          dnf builddep -y --setopt=install_weak_deps=False packaging/omx-plugins.spec

      # an ordinary run builds against the channel, never staging (D25): tools/from-channel-check.sh
      - name: Every omx package comes from the channel
        env:
          # a wave's run builds against its devel channel and staging (Open-Mixer/.github#329)
          OMX_WAVE: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_CHANNEL || '' }}
          # and the base waves add-openmixer's devel-base added beneath it
          OMX_DEVEL_BASE: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_BASE || '' }}
        run: tools/from-channel-check.sh

      - name: make test-heavy, and nothing skipped
        id: handback-test-heavy
        run: |
          set -euo pipefail
          make test-heavy 2>&1 | tee test-heavy.log
          if grep -E '^SKIP' test-heavy.log; then echo "::error::a test was skipped"; exit 1; fi

  selftest:
    # Its own jobs, beside make test: the two together outgrew one job's 30 minutes once the chain and the
    # compressor landed, and the selftest alone once took 82 to 115 minutes against this 120-minute guard. Its parts
    # run in the shards of tools/test/selftest-shards.json, packed by measured time so each is estimated under 45
    # minutes with its setup, the fewest that fit (tools/test/selftest-shards-check.mjs holds this matrix to it). Same
    # container and dependencies; nothing is dropped. The step is plain `make selftest`, the shard from the job's environment.
    name: make selftest ${{ matrix.shard }} (fedora ${{ matrix.cell.fedora }}, ${{ matrix.cell.arch }})
    needs: [changes, rpm-cells]
    if: needs.changes.outputs.machinery == 'true' && needs.rpm-cells.outputs.rpm-count != '0'
    runs-on: ${{ matrix.cell.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.rpm-cells.outputs.rpm) }}
        shard:
          - 1/1
    env:
      OMX_SELFTEST_SHARD: ${{ matrix.shard }}
    container:
      image: ${{ matrix.cell.image }}
    steps:
      - name: Install the build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False git dnf5-plugins

      - name: Add the OpenMixer repository
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          # a pull request into devel, or a dispatch off main, in a wave reads that wave's devel channel above staging (Open-Mixer/.github#329)
          devel-channel: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_CHANNEL || '' }}
          devel-base: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_BASE || '' }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The checkout is a git directory this job may read
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # a dedupe/all run builds on its siblings' dedupe/all (.github/wave-deps); @main until Open-Mixer/.github moves v1 past it
      - uses: Open-Mixer/.github/.github/actions/wave-deps@openmixer-v1

      - name: Install what the spec builds and tests with
        run: |
          dnf builddep -y --setopt=install_weak_deps=False packaging/omx-plugins.spec

      # an ordinary run builds against the channel, never staging (D25): tools/from-channel-check.sh
      - name: Every omx package comes from the channel
        env:
          # a wave's run builds against its devel channel and staging (Open-Mixer/.github#329)
          OMX_WAVE: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_CHANNEL || '' }}
          # and the base waves add-openmixer's devel-base added beneath it
          OMX_DEVEL_BASE: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_BASE || '' }}
        run: tools/from-channel-check.sh

      - name: The recipe machinery, sabotaged arm by arm
        id: handback-selftest
        run: make selftest

  rpm:
    name: omx-plugins RPMs (fedora ${{ matrix.cell.fedora }}, ${{ matrix.cell.arch }})
    needs: [changes, rpm-cells]
    if: needs.changes.outputs.packages == 'true' && needs.rpm-cells.outputs.rpm-count != '0'
    runs-on: ${{ matrix.cell.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.rpm-cells.outputs.rpm) }}
    container:
      image: ${{ matrix.cell.image }}
    steps:
      - name: Install the build tools
        run: |
          dnf install -y --setopt=install_weak_deps=False git rpm-build dnf5-plugins gcc make tar gzip diffutils

      - name: Add the OpenMixer repository
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          # a pull request into devel, or a dispatch off main, in a wave reads that wave's devel channel above staging (Open-Mixer/.github#329)
          devel-channel: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_CHANNEL || '' }}
          devel-base: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_BASE || '' }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # a dedupe/all run builds on its siblings' dedupe/all (.github/wave-deps); @main until Open-Mixer/.github moves v1 past it
      - uses: Open-Mixer/.github/.github/actions/wave-deps@openmixer-v1

      - uses: Open-Mixer/.github/.github/actions/build-rpm@openmixer-v1

      - name: Check the file lists
        run: |
          set -euo pipefail
          for sub in clap lv2; do
            rpm=$(ls rpms/omx-plugins-$sub-[0-9]*.${{ matrix.cell.arch }}.rpm)
            rpm -qlp "$rpm" | grep -v '^/usr/lib/.build-id' | sort > files-$sub.txt
          done
          # BEGIN GENERATED plugins: tools/gen.mjs, the shipped plugins' short names and kernels, the test plugins' ids
          shorts="balancer chorus clipper comp deesser delay doubler drive ducker dyneq eq8 eq16 eq32 flanger geq glue keyed-gate limiter loudlevel multiband phaser pitch plosive reverb rotary spring strip suboct tone transient tremolo trim upward width"
          kernels="balancer chorus clipper comp deesser delay doubler drive ducker dyneq eq8 eq16 eq32 flanger geq glue gate limiter loudlevel mbcomp phaser pitch plosive reverb rotary spring strip suboct tone transient tremolo trim upward width"
          tests="org.openmixer.test-note-echo org.openmixer.test-pool-voice org.openmixer.test-sine-voice org.openmixer.test-transport-probe"
          teststems="omx-test-note-echo omx-test-pool-voice omx-test-sine-voice omx-test-transport-probe"
          # END GENERATED plugins
          { printf '%s\n' /usr/lib/clap /usr/share/doc/omx-plugins-clap /usr/share/doc/omx-plugins-clap/README.md \
              /usr/share/licenses/omx-plugins-clap /usr/share/licenses/omx-plugins-clap/LICENSE
            for p in $shorts; do echo "/usr/lib/clap/omx-$p.clap"; done; } | sort > expected-clap.txt
          diff -u expected-clap.txt files-clap.txt
          # the test instruments: omx-plugins-test, outside every CLAP search path
          rpm -qlp rpms/omx-plugins-test-[0-9]*.${{ matrix.cell.arch }}.rpm | grep -v '^/usr/lib/.build-id' | sort > files-test.txt
          { printf '%s\n' /usr/libexec/omx-plugins /usr/libexec/omx-plugins/test \
              /usr/share/doc/omx-plugins-test /usr/share/doc/omx-plugins-test/README.md \
              /usr/share/licenses/omx-plugins-test /usr/share/licenses/omx-plugins-test/LICENSE
            for t in $teststems; do echo "/usr/libexec/omx-plugins/test/$t.clap"; done; } | sort > expected-test.txt
          diff -u expected-test.txt files-test.txt
          devel=$(find rpms -maxdepth 1 -name "omx-plugins-devel-[0-9]*.rpm" ! -name "*.src.rpm" | head -1)
          rpm -qlp "$devel" | grep -qx /usr/include/omx-plugins/omx_delay_core.h
          rpm -qlp "$devel" | grep -qx /usr/include/omx-plugins/omx_plugin_param.h
          for k in $kernels; do rpm -qlp "$devel" | grep -qx "/usr/include/omx-plugins/omx_${k}_params.h"; done
          for f in /usr/include/omx-plugins/omx_clap_static.h /usr/lib64/libomxplugins.a /usr/lib64/pkgconfig/omxplugins.pc; do
            rpm -qlp "$devel" | grep -qx "$f"
          done
          # one descriptor per shipped plugin that has one, in omx-contract's contract directory, with its manifest: in
          # omx-plugins-contract, a package of their own that the metapackage and the devel package require at their
          # version, read at run time with no -devel installed
          cdir=/usr/share/omx-contract/contract.d/omx-plugins
          rpm -qlp rpms/omx-plugins-contract-[0-9]*.noarch.rpm | sort > files-contract.txt
          { printf '%s\n' "$cdir" "$cdir/MANIFEST.json" "$cdir/plugin-face.json" "$cdir/role-meanings.json" "$cdir/plugins" \
              /usr/share/doc/omx-plugins-contract /usr/share/doc/omx-plugins-contract/README.md \
              /usr/share/licenses/omx-plugins-contract /usr/share/licenses/omx-plugins-contract/LICENSE
            for d in plugins/*/*.descriptor.json; do echo "$cdir/plugins/$(basename "$d" .descriptor.json).json"; done; } | sort > expected-contract.txt
          diff -u expected-contract.txt files-contract.txt
          ! rpm -qlp "$devel" | grep -q '^/usr/share/omx-contract/'
          version=$(sed -n 's/^Version: *//p' packaging/omx-plugins.spec)
          for rpm in rpms/omx-plugins-[0-9]*.${{ matrix.cell.arch }}.rpm "$devel"; do
            rpm -qp --requires "$rpm" | tee requires.txt
            grep -qx "omx-plugins-contract = $version-.*" requires.txt
          done
          # a test plugin's generated declaration (the constants and CLAP id a proof predicts from)
          for t in test-note-echo test-pool-voice test-sine-voice test-transport-probe; do
            rpm -qlp "$devel" | grep -qx "/usr/include/omx-plugins/omx_${t//-/_}_decl.h"
          done
          for p in $shorts; do
            for f in "omx-$p.so" manifest.ttl "omx-$p.ttl"; do grep -qx "/usr/lib64/lv2/omx-$p.lv2/$f" files-lv2.txt; done
          done
          ! grep -vE "^/usr/lib64/lv2/omx-($(tr ' ' '|' <<<"$shorts"))\.lv2(/|\$)|^/usr/share/(doc|licenses)/omx-plugins-lv2(/|\$)" files-lv2.txt

      - name: The packages install and their plugins load
        run: |
          set -euo pipefail
          # a mirror that fails in mid-transfer (curl 56, zchunk checksums) is tried again; a real install error fails the
          # third attempt with its own output on the log
          dnf_retry() {
            local n
            for n in 1 2 3; do
              dnf install -y --setopt=retries=5 "$@" && return 0
              [ "$n" -lt 3 ] && { echo "::warning::dnf install failed, attempt $n of 3"; sleep 15; }
            done
            return 1
          }
          # the metapackage, with both formats beside it as the repository would offer them
          dnf_retry --setopt=install_weak_deps=False rpms/omx-plugins-[0-9]*.${{ matrix.cell.arch }}.rpm \
            rpms/omx-plugins-clap-[0-9]*.${{ matrix.cell.arch }}.rpm rpms/omx-plugins-lv2-[0-9]*.${{ matrix.cell.arch }}.rpm \
            rpms/omx-plugins-contract-[0-9]*.noarch.rpm
          # the descriptors come with the metapackage, no -devel installed
          rpm -qf /usr/share/omx-contract/contract.d/omx-plugins/MANIFEST.json | grep -q '^omx-plugins-contract-'
          # the unit codes are omx-contract's sheet (3.6.0), not this package's
          ! rpm -ql omx-plugins-contract | grep -q '/param-units\.json$'
          ! rpm -q omx-plugins-devel
          req=$(rpm -q --requires omx-plugins)
          grep -qE '^omx-plugins-clap\([a-z0-9-]+\) = ' <<<"$req"
          grep -qE '^omx-plugins-lv2\([a-z0-9-]+\) = ' <<<"$req"
          # the metapackage carries the factory presets, one file per preset
          out=$(rpm -ql omx-plugins); grep -qx /usr/share/omx/presets/org.openmixer.drive/amp-tube.json <<<"$out"
          test "$(grep -c '^/usr/share/omx/presets/.*\.json$' <<<"$out")" = "$(find presets -name '*.json' | wc -l)"
          # BEGIN GENERATED plugins: tools/gen.mjs, the shipped plugins' short names and kernels, the test plugins' ids
          shorts="balancer chorus clipper comp deesser delay doubler drive ducker dyneq eq8 eq16 eq32 flanger geq glue keyed-gate limiter loudlevel multiband phaser pitch plosive reverb rotary spring strip suboct tone transient tremolo trim upward width"
          kernels="balancer chorus clipper comp deesser delay doubler drive ducker dyneq eq8 eq16 eq32 flanger geq glue gate limiter loudlevel mbcomp phaser pitch plosive reverb rotary spring strip suboct tone transient tremolo trim upward width"
          tests="org.openmixer.test-note-echo org.openmixer.test-pool-voice org.openmixer.test-sine-voice org.openmixer.test-transport-probe"
          teststems="omx-test-note-echo omx-test-pool-voice omx-test-sine-voice omx-test-transport-probe"
          # END GENERATED plugins
          for p in $shorts; do
            # captured first: grep -q leaving a pipe early would fail the step under pipefail
            out=$(omx-clap-scan --json /usr/lib/clap/omx-$p.clap); grep -q "\"id\":\"org.openmixer.$p\"" <<<"$out"
            out=$(lv2ls); grep -qx "urn:openmixer:$p" <<<"$out"
            out=$(lv2info "urn:openmixer:$p"); grep -q 'Binary:' <<<"$out"
          done
          # the test instruments open by path from outside the CLAP path, each with its id
          dnf_retry --setopt=install_weak_deps=False rpms/omx-plugins-test-[0-9]*.${{ matrix.cell.arch }}.rpm
          for t in $teststems; do
            out=$(omx-clap-scan --json /usr/libexec/omx-plugins/test/$t.clap); grep -q "\"id\":\"org.openmixer.${t#omx-}\"" <<<"$out"
          done

      - name: The devel package's libomxplugins links and opens every plugin in-process
        run: |
          set -euo pipefail
          # a mirror that fails in mid-transfer (curl 56, zchunk checksums) is tried again; a real install error fails the
          # third attempt with its own output on the log
          dnf_retry() {
            local n
            for n in 1 2 3; do
              dnf install -y --setopt=retries=5 "$@" && return 0
              [ "$n" -lt 3 ] && { echo "::warning::dnf install failed, attempt $n of 3"; sleep 15; }
            done
            return 1
          }
          devel=$(find rpms -maxdepth 1 -name "omx-plugins-devel-[0-9]*.rpm" ! -name "*.src.rpm" | head -1)
          dnf_retry --setopt=install_weak_deps=False "$devel" rpms/omx-plugins-contract-[0-9]*.noarch.rpm
          # BEGIN GENERATED plugins: tools/gen.mjs, the shipped plugins' short names and kernels, the test plugins' ids
          shorts="balancer chorus clipper comp deesser delay doubler drive ducker dyneq eq8 eq16 eq32 flanger geq glue keyed-gate limiter loudlevel multiband phaser pitch plosive reverb rotary spring strip suboct tone transient tremolo trim upward width"
          kernels="balancer chorus clipper comp deesser delay doubler drive ducker dyneq eq8 eq16 eq32 flanger geq glue gate limiter loudlevel mbcomp phaser pitch plosive reverb rotary spring strip suboct tone transient tremolo trim upward width"
          tests="org.openmixer.test-note-echo org.openmixer.test-pool-voice org.openmixer.test-sine-voice org.openmixer.test-transport-probe"
          teststems="omx-test-note-echo omx-test-pool-voice omx-test-sine-voice omx-test-transport-probe"
          # END GENERATED plugins
          gcc -o static-table-host tools/test/static-table-host.c $(pkg-config --cflags --libs omxplugins)
          ./static-table-host $(for p in $shorts; do echo "org.openmixer.$p"; done) --test $tests

      # Not named omx-plugins-rpms-*: the release dry run in this same run downloads that pattern
      # with merge-multiple, and two builds of one NEVRA collide in one directory.
      - uses: actions/upload-artifact@v4
        with:
          name: ci-check-omx-plugins-fc${{ matrix.cell.fedora }}-${{ matrix.cell.arch }}
          path: rpms/*.rpm
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/')) && 7 || 2 }}

  # The deb job's cells, from the shared check matrix (ruling D25): the quick set while a release wave is open
  # (OMX_RELEASE_MATRIX=quick: trixie arm64 alone, no amd64 cell), trixie on amd64 and arm64 otherwise (bookworm is dropped
  # from the matrix, owner 2026-11-27). Each
  # cell runs on the runner of its own architecture (arm64 on ubuntu-24.04-arm): a container of one architecture cannot
  # install the packages of another, and the channel's development debs are trixie arm64 only (omx-plugins ci
  # 44594367073: libomxdsp-dev and libomx-clap-dev not installable in the amd64 container; omx-panel ci 44563540081).
  deb-cells:
    name: the deb cells (check-matrix)
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deb: ${{ steps.m.outputs.deb }}
      deb-count: ${{ steps.m.outputs.deb-count }}
    steps:
      - id: m
        uses: Open-Mixer/.github/.github/actions/check-matrix@openmixer-v1
        with:
          wave: ${{ vars.OMX_RELEASE_MATRIX }}
          deb-releases: '["trixie"]'
          deb-arches: '["amd64", "arm64"]'
          x86-runner: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.OMX_RUNNER || 'ubuntu-latest' }}

  deb:
    name: omx-plugins DEBs (${{ matrix.cell.suite }}, ${{ matrix.cell.arch }})
    needs: deb-cells
    if: needs.deb-cells.outputs.deb-count != '0'
    runs-on: ${{ matrix.cell.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.deb-cells.outputs.deb) }}
    container:
      image: ${{ matrix.cell.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl git dpkg-dev debhelper build-essential lintian python3

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Open-Mixer/.github/.github/actions/deb-deps@openmixer-v1
        with:
          names: clap-headers

      - name: Take build dependencies from the OpenMixer channel
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          # a pull request into devel, or a dispatch off main, in a wave reads that wave's devel channel above staging (Open-Mixer/.github#329)
          devel-channel: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_CHANNEL || '' }}
          devel-base: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_BASE || '' }}

      # a dedupe/all run builds on its siblings' dedupe/all (.github/wave-deps); @main until Open-Mixer/.github moves v1 past it
      - uses: Open-Mixer/.github/.github/actions/wave-deps@openmixer-v1

      - uses: Open-Mixer/.github/.github/actions/build-deb@openmixer-v1

      - name: The packages install and their plugins load
        run: |
          set -euo pipefail
          # the metapackage, with both formats beside it as the repository would offer them. The build host holds the
          # channel's omx-plugins-contract when an older omx-panel requires it; a release not yet bumped builds the same
          # version, so the package under test replaces it, and such an omx-panel goes with it
          apt-get install -y --no-install-recommends --allow-downgrades ./debs/omx-plugins_*.deb ./debs/omx-plugins-clap_*.deb ./debs/omx-plugins-lv2_*.deb \
            ./debs/omx-plugins-contract_*_all.deb
          dev=$(dpkg -c debs/omx-plugins-dev_*.deb); grep -q './usr/include/omx-plugins/omx_delay_core.h' <<<"$dev"
          grep -q './usr/include/omx-plugins/omx_clap_static.h' <<<"$dev"
          grep -qE '\./usr/lib/[^/]+/libomxplugins\.a$' <<<"$dev"
          grep -qE '\./usr/lib/[^/]+/pkgconfig/omxplugins\.pc$' <<<"$dev"
          ! grep -q '\./usr/share/omx-contract/' <<<"$dev"
          # the descriptors are omx-plugins-contract's, which the metapackage and the dev package depend on at this
          # version, installed here with no -dev
          out=$(dpkg -L omx-plugins-contract)
          grep -qx /usr/share/omx-contract/contract.d/omx-plugins/MANIFEST.json <<<"$out"
          # the unit codes are omx-contract's sheet (3.6.0), not this package's
          ! grep -q '/param-units\.json$' <<<"$out"
          test "$(grep -cE '^/usr/share/omx-contract/contract\.d/omx-plugins/plugins/[^/]+\.json$' <<<"$out")" = "$(ls plugins/*/*.descriptor.json | wc -l)"
          ! dpkg -s omx-plugins-dev >/dev/null 2>&1
          info=$(dpkg -I debs/omx-plugins-contract_*_all.deb)
          grep -qE '^ Architecture: all$' <<<"$info"
          # no Breaks, Replaces or Conflicts between our packages (owner rule 2026-11-16, deps-check refuses them in the source)
          ! grep -qE '^ (Breaks|Replaces|Conflicts):' <<<"$info"
          for deb in debs/omx-plugins_*.deb debs/omx-plugins-dev_*.deb; do
            info=$(dpkg -I "$deb"); grep -qE '^ Depends:.*omx-plugins-contract \(= ' <<<"$info"
          done
          dep=$(dpkg -s omx-plugins); grep -q '^Depends: omx-plugins-clap (= .*), omx-plugins-lv2 (= .*)' <<<"$dep"
          # the metapackage carries the factory presets, one file per preset
          out=$(dpkg -L omx-plugins); grep -qx /usr/share/omx/presets/org.openmixer.drive/amp-tube.json <<<"$out"
          test "$(grep -c '^/usr/share/omx/presets/.*\.json$' <<<"$out")" = "$(find presets -name '*.json' | wc -l)"
          # BEGIN GENERATED plugins: tools/gen.mjs, the shipped plugins' short names and kernels, the test plugins' ids
          shorts="balancer chorus clipper comp deesser delay doubler drive ducker dyneq eq8 eq16 eq32 flanger geq glue keyed-gate limiter loudlevel multiband phaser pitch plosive reverb rotary spring strip suboct tone transient tremolo trim upward width"
          kernels="balancer chorus clipper comp deesser delay doubler drive ducker dyneq eq8 eq16 eq32 flanger geq glue gate limiter loudlevel mbcomp phaser pitch plosive reverb rotary spring strip suboct tone transient tremolo trim upward width"
          tests="org.openmixer.test-note-echo org.openmixer.test-pool-voice org.openmixer.test-sine-voice org.openmixer.test-transport-probe"
          teststems="omx-test-note-echo omx-test-pool-voice omx-test-sine-voice omx-test-transport-probe"
          # END GENERATED plugins
          for p in $shorts; do
            # captured first: grep -q leaving a pipe early would fail the step under pipefail
            out=$(dpkg -L omx-plugins-clap); grep -qx "/usr/lib/clap/omx-$p.clap" <<<"$out"
            out=$(dpkg -L omx-plugins-lv2); grep -qx "/usr/lib/lv2/omx-$p.lv2/omx-$p.so" <<<"$out"
            out=$(omx-clap-scan --json /usr/lib/clap/omx-$p.clap); grep -q "\"id\":\"org.openmixer.$p\"" <<<"$out"
            out=$(lv2ls); grep -qx "urn:openmixer:$p" <<<"$out"
            out=$(lv2info "urn:openmixer:$p"); grep -q 'Binary:' <<<"$out"
          done
          # the test instruments open by path from outside the CLAP path, each with its id
          apt-get install -y --no-install-recommends ./debs/omx-plugins-test_*.deb
          for t in $teststems; do
            out=$(dpkg -L omx-plugins-test); grep -qx "/usr/libexec/omx-plugins/test/$t.clap" <<<"$out"
            out=$(omx-clap-scan --json /usr/libexec/omx-plugins/test/$t.clap); grep -q "\"id\":\"org.openmixer.${t#omx-}\"" <<<"$out"
          done
          out=$(dpkg -L omx-plugins-test)
          if grep -q '^/usr/lib/clap' <<<"$out"; then echo "omx-plugins-test puts a file in the CLAP path"; exit 1; fi

      - name: The dev package's libomxplugins links and opens every plugin in-process
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends ./debs/omx-plugins-dev_*.deb
          # BEGIN GENERATED plugins: tools/gen.mjs, the shipped plugins' short names and kernels, the test plugins' ids
          shorts="balancer chorus clipper comp deesser delay doubler drive ducker dyneq eq8 eq16 eq32 flanger geq glue keyed-gate limiter loudlevel multiband phaser pitch plosive reverb rotary spring strip suboct tone transient tremolo trim upward width"
          kernels="balancer chorus clipper comp deesser delay doubler drive ducker dyneq eq8 eq16 eq32 flanger geq glue gate limiter loudlevel mbcomp phaser pitch plosive reverb rotary spring strip suboct tone transient tremolo trim upward width"
          tests="org.openmixer.test-note-echo org.openmixer.test-pool-voice org.openmixer.test-sine-voice org.openmixer.test-transport-probe"
          teststems="omx-test-note-echo omx-test-pool-voice omx-test-sine-voice omx-test-transport-probe"
          # END GENERATED plugins
          gcc -o static-table-host tools/test/static-table-host.c $(pkg-config --cflags --libs omxplugins)
          ./static-table-host $(for p in $shorts; do echo "org.openmixer.$p"; done) --test $tests

  clap-validator:
    # clap-validator is the CLAP project's own conformance tester (state round trips, parameter fuzzing,
    # thread rules). It runs on every built .clap, the test plugins included, and keeps one JSON report each.
    # A failed test fails the job, except the one accepted failure (activate refusing a rate outside the nine oracle
    # rates, tools/clap-validate-summary.mjs), which is printed as an `accepted` line. The factory presets are installed first, where the plugins declare them, because
    # the preset-discovery tests crawl that location.
    name: clap-validator (fedora ${{ matrix.cell.fedora }}, ${{ matrix.cell.arch }})
    needs: rpm-cells
    if: needs.rpm-cells.outputs.rpm-count != '0'
    runs-on: ${{ matrix.cell.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.rpm-cells.outputs.rpm) }}
    container:
      image: ${{ matrix.cell.image }}
    steps:
      - name: Install the build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False git dnf5-plugins

      - name: Add the OpenMixer repository
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          # a pull request into devel, or a dispatch off main, in a wave reads that wave's devel channel above staging (Open-Mixer/.github#329)
          devel-channel: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_CHANNEL || '' }}
          devel-base: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_BASE || '' }}

      - uses: actions/checkout@v4

      # a dedupe/all run builds on its siblings' dedupe/all (.github/wave-deps); @main until Open-Mixer/.github moves v1 past it
      - uses: Open-Mixer/.github/.github/actions/wave-deps@openmixer-v1

      - name: Install what the spec builds with, and clap-validator from the Audinux COPR
        run: |
          set -euo pipefail
          dnf builddep -y --setopt=install_weak_deps=False packaging/omx-plugins.spec
          dnf copr enable -y ycollet/audinux
          # node comes with the builddep above (omx-contract requires it: nodejs22-bin); Fedora's own `nodejs` conflicts with it
          dnf install -y --setopt=install_weak_deps=False clap-validator
          command -v node >/dev/null || { echo "::error::no node after the builddep: the tools need it"; exit 1; }

      # the parallel jobs from the job's CPU quota and the runner's declared CPUs, never the host's nproc
      - name: The parallel jobs this runner may run
        uses: Open-Mixer/.github/.github/actions/jobs@openmixer-v1
        with:
          max: ${{ vars.OMX_RUNNER_CPUS || '3' }}
      - name: Build every plugin
        run: make -j"$OMX_JOBS" all

      - name: Install the factory presets where the plugins declare them
        run: make install-presets

      - name: Validate every built .clap
        run: |
          set -euo pipefail
          mkdir -p build
          tools/clap-validate.sh build/clap-validator 2>&1 | tee build/clap-validator.log
        shell: bash

      - name: Show the failures and the accepted lines on the run page
        if: always()
        run: |
          {
            echo '### clap-validator'
            echo '```'
            grep -E '^(omx-|  accepted|  FAIL|FAIL)' build/clap-validator.log || echo 'no failed test'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clap-validator-reports-fc${{ matrix.cell.fedora }}-${{ matrix.cell.arch }}
          path: |
            build/clap-validator/
            build/clap-validator.log
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/')) && 30 || 2 }}

  release-dry-run:
    name: release workflow, dry run
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    permissions:
      contents: write
      issues: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      arm: false  # the arm64 DEB and the Zynthian tarball build at release only; aarch64 RPMs are off (owner ruling 2026-11-19)
